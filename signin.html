
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Eisen SMS — تسجيل الدخول</title>
<link rel="icon" href="icon.png">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;font-family:Arial,sans-serif;color:#fff;background:linear-gradient(145deg,#030814,#061a3a,#0b2a5b)}
.card{width:100%;max-width:400px;padding:28px 23px;border:1px solid #244775;border-radius:22px;background:#07152bef;box-shadow:0 20px 60px #0007;text-align:center}
.logo{width:76px;height:76px;object-fit:contain;border-radius:18px}
h1{font-size:25px;margin:16px 0 8px}
p{color:#b3c3dc;font-size:14px;line-height:1.8}
input{width:100%;padding:14px;margin-top:13px;border:1px solid #29466e;border-radius:12px;background:#091a35;color:white;font-size:16px;outline:none}
input:focus{border-color:#35c9f4}
button{width:100%;padding:14px;margin-top:16px;border:0;border-radius:12px;background:linear-gradient(90deg,#087bdc,#21c4e8);color:white;font-size:16px;font-weight:bold;cursor:pointer}
button:disabled{opacity:.6}
a{color:#43cafa;text-decoration:none}
.message{font-size:14px;line-height:1.8;overflow-wrap:anywhere;margin-top:14px}
.hidden{display:none}
.footer{margin-top:22px;font-size:12px;color:#8194b3}
#recaptcha-container{display:flex;justify-content:center;margin-top:12px}
</style>
</head>
<body>
<main class="card">
<img src="icon.png" class="logo" alt="Eisen SMS">
<h1>تسجيل الدخول</h1>
<p>أدخل رقم هاتفك لاستلام رمز التحقق عبر SMS</p>

<form id="phoneForm">
<input id="phone" type="tel" placeholder="+213XXXXXXXXX" autocomplete="tel" required>
<div id="recaptcha-container"></div>
<button id="sendButton" type="submit">إرسال رمز التحقق</button>
</form>

<form id="verifyForm" class="hidden">
<input id="code" type="text" inputmode="numeric" autocomplete="one-time-code" placeholder="رمز التحقق المكوّن من 6 أرقام" maxlength="6" required>
<button type="submit" id="verifyButton">تأكيد الرمز والدخول</button>
</form>

<div id="message" class="message" role="status"></div>
<p>أول مرة هنا؟ <a href="signup.html">إنشاء حساب برقم الهاتف</a></p>
<div class="footer">Eisen SMS · مراسلاتك في مكان واحد</div>
</main>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
import {
 getAuth, RecaptchaVerifier, signInWithPhoneNumber
} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";

const firebaseConfig={
 apiKey:"AIzaSyCNkJaxbQHkv9gntmt0tWdiVPMmjmWg-4g",
 authDomain:"eisen-mail.firebaseapp.com",
 projectId:"eisen-mail",
 storageBucket:"eisen-mail.firebasestorage.app",
 messagingSenderId:"857237566012",
 appId:"1:857237566012:web:6cc98d71ae010cfb2ac939",
 measurementId:"G-RFKFWM4B1Y"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const message=document.getElementById("message");
const phoneForm=document.getElementById("phoneForm");
const verifyForm=document.getElementById("verifyForm");
let confirmationResult=null;
let verifier=null;

function showError(error){
 const errors={
  "auth/invalid-phone-number":"رقم الهاتف غير صالح. استخدم مفتاح الدولة، مثل +213.",
  "auth/too-many-requests":"محاولات كثيرة. يرجى الانتظار ثم إعادة المحاولة.",
  "auth/quota-exceeded":"تم بلوغ حد إرسال الرسائل في Firebase.",
  "auth/captcha-check-failed":"فشل التحقق الأمني. أعد تحميل الصفحة.",
  "auth/invalid-verification-code":"رمز التحقق غير صحيح."
 };
 message.textContent=errors[error.code]||"حدث خطأ: "+error.message;
}

phoneForm.addEventListener("submit",async e=>{
 e.preventDefault();
 const button=document.getElementById("sendButton");
 button.disabled=true;
 message.textContent="جارٍ إرسال رمز التحقق...";
 try{
  if(!verifier){
   verifier=new RecaptchaVerifier(auth,"recaptcha-container",{size:"normal"});
   await verifier.render();
  }
  confirmationResult=await signInWithPhoneNumber(
   auth,document.getElementById("phone").value.trim(),verifier
  );
  verifyForm.classList.remove("hidden");
  message.textContent="أُرسل رمز التحقق. أدخله لإتمام تسجيل الدخول.";
 }catch(error){
  showError(error);
  if(verifier){try{verifier.clear()}catch{} verifier=null;}
 }finally{button.disabled=false;}
});

verifyForm.addEventListener("submit",async e=>{
 e.preventDefault();
 const button=document.getElementById("verifyButton");
 button.disabled=true;
 message.textContent="جارٍ التحقق من الرمز...";
 try{
  await confirmationResult.confirm(document.getElementById("code").value.trim());
  message.textContent="تم تسجيل الدخول بنجاح.";
  location.href="README.md";
 }catch(error){showError(error);}
 finally{button.disabled=false;}
});
</script>
</body>
</html>
