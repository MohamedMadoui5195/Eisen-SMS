
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Eisen SMS — إنشاء حساب</title>
<link rel="icon" href="icon.png">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;font-family:Arial,sans-serif;color:#fff;background:linear-gradient(145deg,#030814,#061a3a,#0b2a5b)}
.card{width:100%;max-width:400px;padding:30px 24px;border:1px solid #244775;border-radius:22px;background:#07152bef;box-shadow:0 20px 60px #0007;text-align:center}
.logo{width:76px;height:76px;object-fit:contain;border-radius:18px}
h1{font-size:25px;margin:16px 0 8px}
p{color:#b3c3dc;font-size:14px;line-height:1.8}
input{width:100%;padding:14px;margin-top:13px;border:1px solid #29466e;border-radius:12px;background:#091a35;color:white;font-size:15px;outline:none}
input:focus{border-color:#35c9f4}
button{width:100%;padding:14px;margin-top:17px;border:0;border-radius:12px;background:linear-gradient(90deg,#087bdc,#21c4e8);color:#fff;font-size:16px;font-weight:bold;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
a{color:#43cafa;text-decoration:none}
.message{font-size:14px;line-height:1.8;overflow-wrap:anywhere;margin-top:14px}
.footer{margin-top:22px;font-size:12px;color:#8194b3}
</style>
</head>
<body>
<main class="card">
<img src="icon.png" class="logo" alt="Eisen SMS">
<h1>إنشاء حساب جديد</h1>
<p>أنشئ حسابك وابدأ استخدام Eisen SMS</p>

<form id="signupForm">
<input id="name" type="text" placeholder="الاسم" autocomplete="name" required>
<input id="email" type="email" placeholder="البريد الإلكتروني" autocomplete="email" required>
<input id="password" type="password" placeholder="كلمة المرور (6 أحرف على الأقل)" autocomplete="new-password" minlength="6" required>
<input id="confirmPassword" type="password" placeholder="تأكيد كلمة المرور" autocomplete="new-password" minlength="6" required>
<button id="signupButton" type="submit">إنشاء الحساب</button>
</form>

<div id="message" class="message" role="status"></div>
<p>لديك حساب بالفعل؟ <a href="signin.html">تسجيل الدخول</a></p>
<div class="footer">Eisen SMS · مراسلاتك في مكان واحد</div>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
import {
  getAuth,
  createUserWithEmailAndPassword,
  updateProfile
} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCNkJaxbQHkv9gntmt0tWdiVPMmjmWg-4g",
  authDomain: "eisen-mail.firebaseapp.com",
  projectId: "eisen-mail",
  storageBucket: "eisen-mail.firebasestorage.app",
  messagingSenderId: "857237566012",
  appId: "1:857237566012:web:6cc98d71ae010cfb2ac939",
  measurementId: "G-RFKFWM4B1Y"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const form = document.getElementById("signupForm");
const button = document.getElementById("signupButton");
const message = document.getElementById("message");

form.addEventListener("submit", async (event) => {
  event.preventDefault();

  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const confirmPassword = document.getElementById("confirmPassword").value;

  if (password !== confirmPassword) {
    message.textContent = "كلمتا المرور غير متطابقتين.";
    return;
  }

  button.disabled = true;
  message.textContent = "جارٍ إنشاء الحساب...";

  try {
    const result = await createUserWithEmailAndPassword(auth, email, password);
    await updateProfile(result.user, { displayName: name });

    message.textContent = "تم إنشاء حسابك بنجاح.";
    location.href = "README.md";
  } catch (error) {
    const errors = {
      "auth/email-already-in-use": "هذا البريد الإلكتروني مسجل بالفعل.",
      "auth/invalid-email": "البريد الإلكتروني غير صالح.",
      "auth/weak-password": "كلمة المرور ضعيفة، اختر كلمة أقوى.",
      "auth/network-request-failed": "تحقق من اتصال الإنترنت.",
      "auth/operation-not-allowed": "فعّل تسجيل الدخول بالبريد وكلمة المرور في Firebase."
    };

    message.textContent =
      errors[error.code] || "تعذّر إنشاء الحساب: " + error.message;
  } finally {
    button.disabled = false;
  }
});
</script>
</body>
</html>
