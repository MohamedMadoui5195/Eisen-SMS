
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Eisen SMS — إنشاء حساب</title>
<link rel="icon" href="icon.png">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;font-family:Arial,sans-serif;color:#fff;background:linear-gradient(145deg,#030814,#061a3a,#0b2a5b)}
.card{width:100%;max-width:400px;padding:28px 23px;border:1px solid #244775;border-radius:22px;background:#07152bef;box-shadow:0 20px 60px #0007;text-align:center}
.logo{width:76px;height:76px;object-fit:contain;border-radius:18px}
h1{font-size:25px;margin:16px 0 8px}
p{color:#b3c3dc;font-size:14px;line-height:1.8}
input{width:100%;padding:14px;margin-top:13px;border:1px solid #29466e;border-radius:12px;background:#091a35;color:white;font-size:16px;outline:none}
input:focus{border-color:#35c9f4}
button{width:100%;padding:14px;margin-top:16px;border:0;border-radius:12px;background:linear-gradient(90deg,#087bdc,#21c4e8);color:white;font-size:16px;font-weight:bold;cursor:pointer}
button:disabled{opacity:.6}
a{color:#43cafa;text-decoration:none}
.message{font-size:14px;line-height:1.8;overflow-wrap:anywhere;margin-top:14px}
.hidden{display:none!important}
.footer{margin-top:22px;font-size:12px;color:#8194b3}
#recaptcha-container{display:flex;justify-content:center;margin-top:12px}
</style>
</head>
<body>
<main class="card">
<img src="icon.png" class="logo" alt="Eisen SMS">
<h1>إنشاء حساب جديد</h1>
<p>أنشئ حسابك برقم هاتفك فقط، دون بريد إلكتروني أو كلمة مرور.</p>

<form id="phoneForm">
<input id="phone" type="tel" placeholder="+213XXXXXXXXX" autocomplete="tel" required>
<div id="recaptcha-container"></div>
<button id="sendButton" type="submit">التحقق من الرقم وإرسال الرمز</button>
</form>

<form id="verifyForm" class="hidden">
<input id="code" type="text" inputmode="numeric" autocomplete="one-time-code" placeholder="رمز التحقق المكوّن من 6 أرقام" maxlength="6" pattern="[0-9]{6}" required>
<button id="verifyButton" type="submit">تأكيد الرمز وإنشاء الحساب</button>
<button id="backButton" type="button">تغيير رقم الهاتف</button>
</form>

<div id="message" class="message" role="status" aria-live="polite"></div>
<p>لديك حساب بالفعل؟ <a href="signin.html">تسجيل الدخول</a></p>
<div class="footer">Eisen SMS · مراسلاتك في مكان واحد</div>
</main>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
import {
 getAuth,RecaptchaVerifier,signInWithPhoneNumber
} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";
import {
 getFirestore,doc,getDoc,setDoc,serverTimestamp
} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

const firebaseConfig={
 apiKey:"AIzaSyDFDCcFgBST43TU1RyfZ3Epvoc2JNxrmoI",
 authDomain:"eisen-sms.firebaseapp.com",
 projectId:"eisen-sms",
 storageBucket:"eisen-sms.firebasestorage.app",
 messagingSenderId:"934543543234",
 appId:"1:934543543234:web:3b8b002767769731f2645b",
 measurementId:"G-71J4KLJ8N5"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

const $=id=>document.getElementById(id);
let verifier=null,confirmationResult=null,phoneNumber="",busy=false;

function msg(text,ok=false){
 $("message").textContent=text;
 $("message").style.color=ok?"#61e6a5":"#ffb4b4";
}
function normalizePhone(v){return v.trim().replace(/[\s()-]/g,"");}
function resetCaptcha(){
 if(verifier){try{verifier.clear()}catch(e){}}
 verifier=null;
 $("recaptcha-container").innerHTML="";
}
function errorMessage(e){
 console.error("Firebase:",e.code,e.message);
 const errors={
  "auth/invalid-phone-number":"رقم الهاتف غير صالح. استخدم مفتاح الدولة مثل +213.",
  "auth/too-many-requests":"محاولات كثيرة. انتظر قليلًا ثم أعد المحاولة.",
  "auth/quota-exceeded":"تم بلوغ حد رسائل SMS في Firebase.",
  "auth/captcha-check-failed":"فشل التحقق الأمني. أعد المحاولة.",
  "auth/invalid-verification-code":"رمز التحقق غير صحيح.",
  "auth/code-expired":"انتهت صلاحية الرمز. اطلب رمزًا جديدًا.",
  "permission-denied":"رفضت قواعد Firestore العملية. تحقق من صلاحيات قاعدة البيانات."
 };
 msg((errors[e.code]||("خطأ Firebase: "+(e.code||e.message))));
}

$("phoneForm").addEventListener("submit",async e=>{
 e.preventDefault();
 if(busy)return;
 phoneNumber=normalizePhone($("phone").value);

 if(!/^\+[1-9]\d{7,14}$/.test(phoneNumber)){
  msg("أدخل رقمًا دوليًا صحيحًا، مثل +213XXXXXXXXX.");return;
 }

 busy=true;$("sendButton").disabled=true;

 try{
  msg("جارٍ التحقق من الرقم...");
  const ref=doc(db,"phoneAccounts",phoneNumber);
  const existing=await getDoc(ref);

  if(existing.exists()){
   msg("هذا الرقم مسجّل بالفعل. انتقل إلى تسجيل الدخول.");return;
  }

  verifier=new RecaptchaVerifier(auth,"recaptcha-container",{size:"normal"});
  await verifier.render();

  msg("جارٍ إرسال رمز SMS...");
  confirmationResult=await signInWithPhoneNumber(auth,phoneNumber,verifier);

  $("phoneForm").classList.add("hidden");
  $("verifyForm").classList.remove("hidden");
  msg("أُرسل الرمز إلى هاتفك. أدخله لإكمال التسجيل.",true);
  $("code").focus();
 }catch(e){
  errorMessage(e);resetCaptcha();
 }finally{
  busy=false;$("sendButton").disabled=false;
 }
});

$("verifyForm").addEventListener("submit",async e=>{
 e.preventDefault();
 if(busy)return;
 if(!confirmationResult){msg("اطلب رمز التحقق أولًا.");return;}

 const code=$("code").value.trim();
 if(!/^\d{6}$/.test(code)){msg("أدخل الرمز المكوّن من 6 أرقام.");return;}

 busy=true;$("verifyButton").disabled=true;

 try{
  msg("جارٍ تأكيد رقم الهاتف...");
  const result=await confirmationResult.confirm(code);
  const user=result.user;

  if(normalizePhone(user.phoneNumber||"")!==phoneNumber){
   await auth.signOut();
   msg("رقم الهاتف المؤكد غير مطابق.");return;
  }

  const ref=doc(db,"phoneAccounts",phoneNumber);
  const existing=await getDoc(ref);

  if(existing.exists()){
   msg("الحساب موجود بالفعل. يمكنك تسجيل الدخول.");
   await auth.signOut();
   return;
  }

  await setDoc(ref,{
   phone:phoneNumber,
   uid:user.uid,
   createdAt:serverTimestamp()
  });

  msg("تم إنشاء الحساب بنجاح!",true);
  location.replace("README.md");
 }catch(e){
  errorMessage(e);
 }finally{
  busy=false;$("verifyButton").disabled=false;
 }
});

$("backButton").addEventListener("click",()=>{
 confirmationResult=null;
 $("verifyForm").classList.add("hidden");
 $("phoneForm").classList.remove("hidden");
 $("code").value="";
 resetCaptcha();
 msg("أدخل رقم الهاتف.");
});
</script>
</body>
</html>
