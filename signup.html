
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Eisen SMS — إنشاء حساب</title>
<link rel="icon" href="icon.png">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;font-family:Arial,sans-serif;color:#fff;background:linear-gradient(145deg,#030814,#061a3a,#0b2a5b)}
.card{width:100%;max-width:400px;padding:28px 23px;border:1px solid #244775;border-radius:22px;background:#07152bef;box-shadow:0 20px 60px #0007;text-align:center}
.logo{width:76px;height:76px;object-fit:contain;border-radius:18px}
h1{font-size:25px;margin:16px 0 8px}
p{color:#b3c3dc;font-size:14px;line-height:1.8}
input{width:100%;padding:14px;margin-top:13px;border:1px solid #29466e;border-radius:12px;background:#091a35;color:white;font-size:16px;outline:none}
input:focus{border-color:#35c9f4}
button{width:100%;padding:14px;margin-top:16px;border:0;border-radius:12px;background:linear-gradient(90deg,#087bdc,#21c4e8);color:white;font-size:16px;font-weight:bold;cursor:pointer}
button:disabled{opacity:.6}
a{color:#43cafa;text-decoration:none}
.message{font-size:14px;line-height:1.8;overflow-wrap:anywhere;margin-top:14px}
.footer{margin-top:22px;font-size:12px;color:#8194b3}
</style>
</head>
<body>
<main class="card">
<img src="icon.png" class="logo" alt="Eisen SMS">
<h1>إنشاء حساب جديد</h1>
<p>أنشئ حسابك باستخدام رقم الهاتف وكلمة المرور.</p>

<form id="form">
<input id="phone" type="tel" placeholder="+213XXXXXXXXX" autocomplete="tel" required>
<input id="password" type="password" placeholder="كلمة المرور (6 أحرف على الأقل)" minlength="6" autocomplete="new-password" required>
<input id="confirm" type="password" placeholder="تأكيد كلمة المرور" minlength="6" autocomplete="new-password" required>
<button id="submit" type="submit">إنشاء الحساب</button>
</form>

<div id="message" class="message" role="status"></div>
<p>لديك حساب بالفعل؟ <a href="signin.html">تسجيل الدخول</a></p>
<div class="footer">Eisen SMS · مراسلاتك في مكان واحد</div>
</main>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
import {
 getAuth,createUserWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";

const app=initializeApp({
 apiKey:"AIzaSyDFDCcFgBST43TU1RyfZ3Epvoc2JNxrmoI",
 authDomain:"eisen-sms.firebaseapp.com",
 projectId:"eisen-sms",
 storageBucket:"eisen-sms.firebasestorage.app",
 messagingSenderId:"934543543234",
 appId:"1:934543543234:web:3b8b002767769731f2645b",
 measurementId:"G-71J4KLJ8N5"
});

const auth=getAuth(app);
const $=id=>document.getElementById(id);
const message=$("message");

function phoneEmail(value){
 const phone=value.trim().replace(/[\s()-]/g,"");
 if(!/^\+[1-9]\d{7,14}$/.test(phone)) throw Error("phone");
 return phone.replace(/\D/g,"")+"@phone.eisen-sms.invalid";
}

$("form").addEventListener("submit",async e=>{
 e.preventDefault();
 const button=$("submit");
 button.disabled=true;

 try{
  const email=phoneEmail($("phone").value);
  const password=$("password").value;

  if(password.length<6){
   throw {code:"weak-password"};
  }
  if(password!==$("confirm").value){
   throw {code:"password-mismatch"};
  }

  await createUserWithEmailAndPassword(auth,email,password);
  message.style.color="#61e6a5";
  message.textContent="تم إنشاء الحساب بنجاح. جارٍ الانتقال...";
  location.replace("index.html");

 }catch(error){
  const errors={
   "phone":"أدخل رقم هاتف دوليًا صحيحًا، مثل +213XXXXXXXXX.",
   "weak-password":"كلمة المرور يجب أن تتكون من 6 أحرف على الأقل.",
   "password-mismatch":"كلمتا المرور غير متطابقتين.",
   "auth/email-already-in-use":"هذا الرقم لديه حساب بالفعل. سجّل الدخول.",
   "auth/invalid-email":"تعذر قبول بيانات الحساب.",
   "auth/operation-not-allowed":"فعّل Email/Password من Firebase Authentication.",
   "auth/weak-password":"كلمة المرور ضعيفة؛ استخدم 6 أحرف على الأقل.",
   "auth/network-request-failed":"تحقق من اتصال الإنترنت."
  };
  message.style.color="#ffb4b4";
  message.textContent=errors[error.code]||("تعذر إنشاء الحساب: "+(error.code||error.message));
  console.error(error);
 }finally{
  button.disabled=false;
 }
});
</script>
</body>
</html>
